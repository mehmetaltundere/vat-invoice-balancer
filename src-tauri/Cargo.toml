[package]
name = "efa"
version = "0.1.0"
description = "EFA - EXlora Fatura Asistanı"
authors = ["EXlora"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "efa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "efa"
path = "src/main.rs"
